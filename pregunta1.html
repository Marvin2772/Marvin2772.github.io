<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta 1 - Tribique_Tech</title>
  <meta name="description" content="Primera pregunta de la Trivia de Programación de Tribique_Tech">
  <meta name="author" content="Tribique_Tech">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- ENCABEZADO -->
  <header>
    <h1>Trivia de Programación - Pregunta 1</h1>
    <p>Demuestra tus conocimientos. ¡Tienes tiempo limitado!</p>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main>
    <section class="pregunta">
      <!-- 🔹 Aquí el JS insertará el texto de la pregunta -->
      <h2 id="question"></h2>

      <!-- TEMPORIZADOR -->
      <div class="temporizador">
        <h3>Temporizador</h3>
        <p>Tiempo restante: <span id="timer">15s</span></p>
      </div>

      <!-- 🔹 Aquí el JS generará los botones -->
      <div id="options" class="opciones"></div>
    </section>
  </main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p>&copy; 2025 Tribique_Tech | Todos los derechos reservados</p>
  </footer>

  <!-- 🔹 Script principal (usa tu banco de preguntas y temporizador) -->
  <script src="js/scripts.js"></script>

  <!-- 🔹 Script local para iniciar la pregunta automáticamente -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // Mostrar la pregunta al cargar la página
      if (typeof showQuestion === "function") {
        showQuestion();
      }
      // Iniciar el temporizador automáticamente
      if (typeof startTimer === "function") {
        startTimer();
      }
    });
  </script>

</body>
</html>
