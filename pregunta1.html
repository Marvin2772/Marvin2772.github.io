<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta 1</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <h2>1. ¿Qué significa HTML?</h2>
  <button onclick="checkAnswer(0)">HyperText Markup Language</button>
  <button onclick="checkAnswer(1)">HighText Machine Language</button>
  <button onclick="checkAnswer(2)">HyperTransfer Markup Language</button>

  <script>
    function checkAnswer(selected) {
      const correct = 0;
      let score = parseInt(localStorage.getItem("score")) || 0;
      if (selected === correct) score++;
      localStorage.setItem("score", score);
      window.location.href = "resultado.html";
    }
  </script>
</body>
</html>
