<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia - Tribique_Tech</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <h1>Trivia de Programación</h1>
    <p>Demuestra tus conocimientos. ¡Tienes tiempo limitado!</p>
  </header>

  <main id="quiz-container">
    <section class="pregunta">
      <h2 id="question">Cargando pregunta...</h2>

      <div class="temporizador">
        <h3>Temporizador</h3>
        <p>Tiempo restante: <span id="timer">15s</span></p>
      </div>

      <div id="options" class="opciones"></div>
      <button id="nextBtn" class="hidden">Siguiente</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Tribique_Tech | Todos los derechos reservados</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
