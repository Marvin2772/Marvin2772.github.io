<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tribique_Tech - Trivia de Programación</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="game-container">
    <div class="header-content">
      <img src="img/imagen.png" alt="TRIBIQUEE TECH" class="logo-image">
      
      <h1>Bienvenido a la Trivia de Programación</h1>
      <p class="subtitle">Responde preguntas básicas y demuestra tus conocimientos.</p>
    </div>

    <div class="input-area">
      <input type="text" id="username" placeholder="Ingresa tu nombre" class="text-input">
      <button onclick="startGame()" class="start-button">Comenzar juego</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2025 - Todos los derechos reservados</p>
    <p>Tribique_Tech</p>
  </footer>

  <script>
    function startGame() {
      const name = document.getElementById("username").value.trim();
      if (name === "") {
        alert("Por favor, ingresa tu nombre");
        return;
      }
      localStorage.setItem("username", name);
      localStorage.setItem("score", 0);
      // Asumiendo que 'preguntas.html' existe para la siguiente fase del juego
      window.location.href = "preguntas.html"; 
    }
  </script>
</body>
</html>
